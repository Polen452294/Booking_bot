# Requires Docker Compose >= 2.24.4 (!override / !reset).
# Use --env-file .env.production; no development .env is injected into containers.
x-production-environment: &production-environment
  APP_ENV: production
  APP_NAME: ${APP_NAME:-Telegram Specialist Booking Bot}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:?Set production DATABASE_URL}
  REDIS_URL: ${REDIS_URL:?Set production REDIS_URL}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN}
  TELEGRAM_WEBHOOK_BASE_URL: ${TELEGRAM_WEBHOOK_BASE_URL:?Set HTTPS webhook origin}
  TELEGRAM_WEBHOOK_HEADER_SECRET: ${TELEGRAM_WEBHOOK_HEADER_SECRET:?Set webhook secret}
  TELEGRAM_PROXY_URL: ${DOCKER_TELEGRAM_PROXY_URL:-}
  SPECIALIST_CONFIG_PATH: /app/specialist.toml
  DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
  DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-5}
  DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
  BOOKING_HORIZON_DAYS: ${BOOKING_HORIZON_DAYS:-60}
  BOOKING_MIN_LEAD_HOURS: ${BOOKING_MIN_LEAD_HOURS:-3}
  SLOT_HOLD_MINUTES: ${SLOT_HOLD_MINUTES:-10}
  CANCELLATION_CUTOFF_HOURS: ${CANCELLATION_CUTOFF_HOURS:-24}
  BOOKING_DATES_SHOWN: ${BOOKING_DATES_SHOWN:-14}
  NOTIFICATION_POLL_INTERVAL_SECONDS: ${NOTIFICATION_POLL_INTERVAL_SECONDS:-2}
  NOTIFICATION_BATCH_SIZE: ${NOTIFICATION_BATCH_SIZE:-20}
  NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}

x-specialist-volume: &specialist-volume
  type: bind
  source: ${SPECIALIST_CONFIG_PATH:?Set host path to specialist.toml}
  target: /app/specialist.toml
  read_only: true
  bind:
    create_host_path: false

x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  init:
    logging: *log-rotation
    image: ${BOOKING_IMAGE:?Set an immutable release image or digest}
    environment: *production-environment
    volumes:
      - *specialist-volume
    command: ["sh", "-c", "alembic upgrade head && exec booking-admin configure"]
    restart: "no"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  api:
    logging: *log-rotation
    build: !reset null
    image: ${BOOKING_IMAGE:?Set an immutable release image or digest}
    env_file: !override []
    environment: !override
      <<: *production-environment
      LOG_SERVICE: api
    volumes: !override
      - *specialist-volume
    ports: !override
      - "127.0.0.1:${API_PORT:-8000}:8000"
    command: ["python", "-m", "booking_bot.server"]
    depends_on: !override
      init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  worker:
    logging: *log-rotation
    build: !reset null
    image: ${BOOKING_IMAGE:?Set an immutable release image or digest}
    env_file: !override []
    environment: !override
      <<: *production-environment
      LOG_SERVICE: worker
    volumes: !override
      - *specialist-volume
    ports: !reset []
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]

  postgres:
    logging: *log-rotation
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: !reset []
    restart: unless-stopped
    stop_grace_period: 60s

  redis:
    logging: *log-rotation
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    # Keep the official entrypoint: it fixes volume ownership and drops to user redis.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    ports: !reset []
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  redis_data:
