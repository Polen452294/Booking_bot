[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram-specialist-booking-bot"
dynamic = ["version"]
description = "Reusable single-specialist Telegram booking bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram==3.30.0",
  "aiohttp-socks==0.11.0",
  "alembic==1.18.5",
  "asyncpg>=0.30,<1",
  "fastapi[standard]==0.139.2",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<8",
  "sqlalchemy[asyncio]==2.0.51",
  "tzdata==2026.3",
]

[project.optional-dependencies]
backup-s3 = ["boto3>=1.35,<2"]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
booking-admin = "booking_bot.cli:main"
bookingctl = "booking_bot.deployment.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/booking_bot"]

[tool.hatch.version]
path = "src/booking_bot/version.py"

[tool.pytest.ini_options]
addopts = "-q -m 'not integration'"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: requires isolated PostgreSQL and Redis test services",
]


[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
